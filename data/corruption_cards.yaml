:cards:
  0:
    :name: Despondent
    :favor_cost: 3
    :flaw: despondent
    :desc: When you rest or are defeated, the left-most Sauron victory marker is advanced 2 spaces (instead of 1).
  1:
    :name: Hopeless
    :favor_cost: 2
    :flaw: hopeless
    :desc: You may not take more than 3 Travel steps during each of your future turns.
  4:
    :name: Wretched
    :immediate: wretched
    :desc: Your turn immediately ends. Sauron may then choose to move you to the nearest Haven. Then shuffle this card and the discard pile back into the Corruption deck.
  6:
    :name: Greedy
    :favor_cost: 2
    :flaw: greedy
    :desc: When Sauron plays a Shadow card on your turn, he may then draw a new Shadow card.
  12:
    :name: Mistrusted
    :favor_cost: 2
    :flaw: mistrusted
    :desc: You may not gain more than 1 favor during each future turn.
  13:
    :name: Reckless
    :favor_cost: 1
    :flaw: reckless
    :desc: When Sauron draws Peril cards on your turn, he may draw 1 additional card.
  15:
    :name: Indifferent
    :favor_cost: 1
    :flaw: indifferent
    :desc: When you draw Encounter cards, draw 2 instead of 3.

  10:
    :name: Careless
    :immediate: careless
    :desc: Immediately discard 2 favor from your hero sheet. Then Shuffle this card and the discard pile back into the Corruption deck.

  2:
    :name: Helpless
    :favor_cost: 2
    :modification: helpless
    :desc: Your agility is reduced by 1.
  7:
    :name: Weary
    :favor_cost: 2
    :modification: weary
    :desc: Your fortitude is reduced by 1.
  8:
    :name: Deranged
    :favor_cost: 2
    :modification: derangd
    :desc: Your wisdom is reduced by 1.
  14:
    :name: Weak
    :favor_cost: 2
    :modification: weak
    :desc: Your strength is reduced by 1

  3:
    :name: Distraught
    :favor_cost: 2
    :flaw: distraught
    :modification: distraught
    :desc: You may never have more than 7 hero cards in your hand.

  9:
    :name: Dispairing
    :favor_cost: 2
    :flaw: dispairing
    :modification: dispairing
    :desc: You may never have more than 3 favor on your hero sheet.
  5:
    :name: Cowardly
    :favor_cost: 2
    :flaw: cowardly
    :desc: At the start of each future combat that you are involved in, you must discard 1 random Hero card.
  11:
    :name: Isolated
    :favor_cost: 2
    :flaw: isolated
    :desc: You may not consult with characters or trade with other heroes.
