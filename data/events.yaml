    :favors:
      - "dunland"
  11:
    :name: "Eomer and Eowyn Are Orphaned"
    :priority: 5
    :text: "Sauron may discard 1 character or 1 favor from a location in Rohan."
    :ability:
      :type: "sauron_discards_character_or_favor"
      :region: "rhoan"
    :character:
      :name: "denethor"
      :location: "pelargir"
    :favors:
      - "rhosgobel"
  12:
    :name: "Lady of the Golden Wood"
    :priority: 10
    :text: "Affects Lothlorien. After a hero explores here, he may gain a \"Boat\" Item card or remove 1 influence from the Shadow Pool. Then discard this card."
    :ability:
      :type: "on_explore"
      :rewards:
        - :type: "boat"
        - :type: "shadow_pool_loss"
          :count: 1
    :character:
      :name: "boromir"
      :location: "dunharrow"
    :favors:
      - "the_withered_heath"
    :affect: "lothlorien"
  13:
    :name: "Not All Those Who Wander Are Lost"
    :priority: 13
    :text: "Affects Rhun. After a hero explores here he may move to any location. Then discard this card."
    :ability:
      :type: "on_explore"
      :rewards:
        - :type: "move_anywhere"
    :character:
      :name: "aragorn"
      :location: "rhun"
    :favors:
      - "the_forest_road"
    :affect: "rhun"
