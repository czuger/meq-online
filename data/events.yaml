---
# The 42 Event cards, by stage deck then picture number (static/images/events).
# Transcribed from the card pictures; `text` is the printed ability.
:I:
  0:
    :name: "Messengers of the Stormcrow"
    :priority: 1
    :text: "Each hero that has favor must immediately either spend 1 favor or receive 1 Corruption card."
    :ability:
      :type: "favor_or_corruption"
    :character:
      :name: "theoden"
      :location: "helms_deep"
    :favors:
      - "bree"
  1:
    :name: "Beornings, the Skin Changers"
    :priority: 6
    :text: "The heroes may remove up to 2 monster tokens from or deal 2 damage to a minion in any location in the region of Mirkwood."
    :ability:
      :type: "clear_monsters_or_hurt_minion"
      :region: "mirkwood"
      :monsters: 2
      :damage: 2
    :character:
      :name: "dain"
      :location: "the_iron_hills"
    :favors:
      - "the_high_pass"
  2:
    :name: "The Thieves of Tharbad"
    :priority: 4
    :text: "Sauron must choose a character. Place or move the character to the Mouth of the Greyflood."
    :ability:
      :type: "sauron_moves_character"
      :location: "mouth_of_the_greyflood"
    :favors:
      - "tharbad"
      - "the_bight"
  3:
    :name: "Trust in Friendship"
    :priority: 3
    :text: "Each hero loses 1 favor and places it on this card. Then Sauron gives this card to any hero. After this hero explores a location containing a character or another hero, he gains this favor and then discards this card."
    :ability:
      :type: "trust_in_friendship"
    :character:
      :name: "dain"
      :location: "lake_esgaroth"
    :favors:
      - "osgiliath"
  4:
    :name: "From Argonath to the Sea"
    :priority: 9
    :text: "Affects Minas Tirith. After a hero explores here, he may remove 1 influence from each adjacent location. Then discard this card."
    :ability:
      :type: "on_explore"
      :rewards:
        - :type: "remove_adjacent_influence"
    :character:
      :name: "thranduil"
      :location: "the_forest_trail"
    :favors:
      - "ettenmoors"
    :affect: "minas_tirith"
  5:
    :name: "Gandalf Visits Frodo"
    :priority: 14
    :text: "Affects The Shire. After a hero explores here, he may spend 3 favor to move the hero story marker one space up the Story Track. Then discard this card."
    :ability:
      :type: "on_explore"
      :rewards:
        - :type: "advance_heroes"
          :cost: 3
    :character:
      :name: "gandalf"
      :location: "the_shire"
    :favors:
      - "eregion"
    :affect: "the_shire"
  6:
    :name: "Tempted by Power"
    :priority: 2
    :text: "Sauron chooses one hero. The hero must choose to gain 1 Corruption card and receive training, or allow Sauron to draw 1 Plot card."
    :ability:
      :type: "temptation"
      :reward: "training"
      :refusal: "plot"
    :character:
      :name: "saruman"
      :location: "fangorn"
    :favors:
      - "emyn_muil"
  7:
    :name: "Imladris"
    :priority: 12
    :text: "Affects Rivendell. After a hero explores here, he may discard 1 of his Corruption cards or gain 1 level of fortitude. Then discard this card."
    :ability:
      :type: "on_explore"
      :rewards:
        - :type: "discard_corruption"
        - :type: "gain_fortitude"
    :favors:
      - "ered_mithrin"
      - "gap_of_rohan"
    :affect: "rivendell"
  8:
    :name: "The Dunadan Guards the Shire"
    :priority: 7
    :text: "The heroes may remove 3 influence/monster tokens from any locations in Eriador or place 1 favor in The Shire."
    :ability:
      :type: "clear_tokens_or_favor"
      :area:
        :region: "eriador"
      :max: 3
      :favor: "the_shire"
    :favors:
      - "the_northdowns"
      - "dead_marshes"
  9:
    :name: "Arwen's Message to Her Beloved"
    :priority: 11
    :text: "Affects Weathertop. After a hero explores here, he gains 1 favor or receives training. Then discard this card."
    :ability:
      :type: "on_explore"
      :rewards:
        - :type: "favor"
          :count: 1
        - :type: "training"
    :character:
      :name: "aragorn"
      :location: "weathertop"
    :favors:
      - "lothlorien"
    :affect: "weathertop"
  10:
    :name: "The Courage of Erkenbrand"
    :priority: 8
    :text: "The heroes may remove up to 3 influence/monster tokens from Rohan or place 1 favor in Helm's Deep."
    :ability:
