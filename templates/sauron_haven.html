{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Refuge du héros vaincu</h1>
  <p class="lead">{{ hero_name }} a été vaincu. Plusieurs refuges sont aussi proches : choisissez celui où il est transporté.</p>
  <form method="post" action="/sauron/{{ sauron_id }}/haven" class="box">
    {% for (code, name) in havens %}
    <label class="option" for="haven_{{ code }}"><input type="radio" name="haven" id="haven_{{ code }}" value="{{ code }}"{% if loop.first %} checked{% endif %}> {{ name }}</label>
    {% endfor %}
    <div class="actions"><button type="submit" class="btn btn-primary">Valider</button></div>
  </form>
</div>
{% endblock %}
