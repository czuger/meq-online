{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Gardez {{ to_keep }} carte(s) intrigue</h3>
  <div class="alert alert-secondary"><ul class="mt-3"><li>Les cartes que vous ne gardez pas vont sous la pioche des intrigues.</li></ul></div>
  {% for card in cards %}<img src="{{ card.pic }}" class="medium-card selectable-card-selection-multiple" data-card-id="{{ card.id }}" alt="">{% endfor %}
  <form method="post" action="/sauron/{{ sauron_id }}/plot_cards/keep" class="ml-3">
    <input type="hidden" id="selected_cards" name="selected_cards">
    <button type="submit" class="btn btn-secondary" id="validate_multiple"{% if to_keep > 0 %} disabled{% endif %}>Garder</button>
  </form>
</div>
{% endblock %}
