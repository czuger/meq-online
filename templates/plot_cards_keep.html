{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Gardez {{ to_keep }} carte(s) intrigue</h1>
  <p class="lead">Les cartes que vous ne gardez pas vont sous la pioche des intrigues.</p>
  <div class="cards">{% for card in cards %}<img src="{{ card.pic }}" class="medium-card selectable-card-selection-multiple" data-card-id="{{ card.id }}" alt="">{% endfor %}</div>
  <p class="selection-count" data-selection-count>Aucune carte choisie.</p>
  <form method="post" action="/sauron/{{ sauron_id }}/plot_cards/keep">
    <input type="hidden" id="selected_cards" name="selected_cards">
    <div class="actions"><button type="submit" class="btn btn-primary" id="validate_multiple"{% if to_keep > 0 %} disabled{% endif %}>Garder</button></div>
  </form>
</div>
{% endblock %}
