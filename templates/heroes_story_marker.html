{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Avancer le plus bas des marqueurs d'histoire</h3>
  <div class="alert alert-secondary"><ul class="mt-3"><li>Choisissez l'un des marqueurs d'histoire de Sauron et faites-le avancer.</li></ul></div>
  <hr>
  <div class="row">
    {% for (code, label) in markers %}
    <div class="col-md-3"><a class="btn btn-primary btn-block" role="button" href="/heroes/{{ hero_id }}/after_rest_advance_story_marker?marker={{ code }}">{{ label }}</a></div>
    {% endfor %}
  </div>
</div>
{% endblock %}
