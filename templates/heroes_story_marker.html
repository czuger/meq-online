{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Avancer le plus bas des marqueurs d'histoire</h1>
  <p class="lead">Choisissez l'un des marqueurs d'histoire de Sauron et faites-le avancer.</p>
  <form method="post" action="/heroes/{{ hero_id }}/after_rest_advance_story_marker" class="button-grid">
    {% for (code, label) in markers %}
    <button type="submit" name="marker" value="{{ code }}" class="btn btn-primary">{{ label }}</button>
    {% endfor %}
  </form>
</div>
{% endblock %}
