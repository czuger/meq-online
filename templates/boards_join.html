{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Rejoindre la partie</h1>
  {% if heroes.is_empty() %}
  <p>Toutes les places de cette partie sont prises.</p>
  {% else %}
  <form method="post" action="/boards/{{ board_id }}/join" class="box">
    <h4>Choisissez votre héros</h4>
    {% for (code, name) in heroes %}
    <label class="option" for="hero_{{ code }}"><input type="radio" name="hero" id="hero_{{ code }}" value="{{ code }}"{% if loop.first %} checked{% endif %}> {{ name }}</label>
    {% endfor %}
    <div class="actions"><button type="submit" class="btn btn-primary">Rejoindre</button></div>
  </form>
  {% endif %}
</div>
{% endblock %}
