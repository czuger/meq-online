{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Mes messages</h1>
  <div class="actions"><a class="btn btn-primary" href="{{ base_url }}/new">Nouveau message</a></div>
  {% for message in messages %}
  <div class="box">
    <div class="muted">{{ message.header }}</div>
    <div class="{% if message.sent %}note{% else %}note note-success{% endif %}">{{ message.text }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
