{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Préparation du combat</h1>
  <p class="lead">Chaque point d'agilité dépensé vous fait piocher une carte ; chaque point non dépensé ajoute 1 à votre force pour ce combat.</p>
  {% if let Some(note) = modifiers %}<div class="note note-warn">{{ note }}</div>{% endif %}
  <form method="post" action="/boards/{{ board_id }}/combats/combat_setup" class="field-inline">
    <label for="draw">Agilité dépensée pour piocher</label>
    <input type="number" id="draw" name="draw" value="0" min="0" max="{{ agility }}" data-agility="{{ agility }}">
    <span class="muted" data-agility-result></span>
    <button type="submit" class="btn btn-primary">Valider</button>
  </form>
</div>
{% endblock %}
