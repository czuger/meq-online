{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Personnages</h1>
  <form method="post" action="/characters/{{ sauron_id }}" class="box">
    {% for character in characters %}
    <div class="field-inline">
      <label for="character-{{ character.code }}" style="min-width: 12em">{{ character.name }}</label>
      <select id="character-{{ character.code }}" name="characters[{{ character.code }}]">
        <option value=""></option>
        {% for option in character.options %}
        <option value="{{ option.code }}"{% if option.selected %} selected{% endif %}>{{ option.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endfor %}
    <div class="actions"><button type="submit" class="btn btn-primary">Valider</button></div>
  </form>
</div>
{% endblock %}
