{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Pouvoir d'Argalad</h1>
  <p class="lead">Une fois par tour, Argalad peut voir les monstres qui l'entourent.</p>
  <table class="table">
    <thead><tr><th>Lieu</th><th>Monstre</th></tr></thead>
    <tbody>
      {% for (location, name) in monsters %}
      <tr><td>{{ location }}</td><td>{{ name }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="actions">
    <a class="btn btn-primary" role="button" href="/heroes/{{ hero_id }}/movement_screen">Retour au déplacement</a>
  </div>
</div>
{% endblock %}
