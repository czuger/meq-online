{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Défausser une carte intrigue</h3>
  <div class="alert alert-secondary">
    <ul class="mt-3">
      <li>Sur cet écran, vous pouvez retirer une carte intrigue du plateau.</li>
      <li>Rappel : vous ne pouvez placer ou défausser qu'une carte par tour.</li>
    </ul>
  </div>
  <div class="row">
    {% for slot in slots %}<div class="col-md-4"><img src="{{ slot.pic }}" class="big-card selectable-card-selection-unique" data-card-id="{{ slot.id }}" alt=""></div>{% endfor %}
  </div>
  <form method="post" action="/sauron/{{ sauron_id }}/plot_cards/discard" class="my-3 ml-3">
    <div class="row">
      <div class="col-md-2">
        <input type="hidden" id="selected_card" name="selected_card">
        <button type="submit" class="btn btn-secondary btn-block" id="validate_unique" disabled>Défausser</button>
      </div>
      <div class="col-md-2"><a class="btn btn-secondary btn-block" role="button" href="/sauron/{{ sauron_id }}/plot_cards/play_screen">Jouer une carte</a></div>
      <div class="col-md-2"><a class="btn btn-primary btn-block" role="button" href="/sauron/{{ sauron_id }}/plot_cards/play_finished">Terminé</a></div>
    </div>
  </form>
</div>
{% endblock %}
