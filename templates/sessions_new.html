{% extends "layout.html" %}
{% block content %}
<div class="page">
  <form method="post" action="/auth/developer/callback" class="box" style="max-width: 420px; margin: 32px auto;">
    <h2>Connexion (développement)</h2>
    <div class="field">
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
