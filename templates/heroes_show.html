{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>{{ info.name }}</h1>
  {% include "cards_hand.html" %}
  <div class="hero-sheet">
    <img src="{{ sheet_pic }}" alt="{{ info.name }}">
    {% if !corruptions.is_empty() %}
    <div>
      <h3>Corruptions</h3>
      <div class="cards">{% for card in corruptions %}<img src="{{ card.pic }}" class="small-card" alt="">{% endfor %}</div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
