{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Pioche</h1>
  <p class="lead">Vous pouvez piocher autant de cartes que votre endurance, ou moins.</p>
  {% if left_to_draw > 0 %}
  <form method="post" action="/heroes/{{ hero_id }}/draw_cards" class="field-inline">
    <label for="nb_cards">Nombre de cartes</label>
    <input type="number" id="nb_cards" name="nb_cards" value="{{ left_to_draw }}" min="0" max="{{ left_to_draw }}">
    <button type="submit" class="btn btn-primary">Piocher</button>
  </form>
  {% endif %}
  <div class="actions">
    <form method="post" action="/heroes/{{ hero_id }}/draw_cards_finished"><button type="submit" class="btn{% if left_to_draw == 0 %} btn-primary{% endif %}">Terminer</button></form>
  </div>
</div>
{% endblock %}
