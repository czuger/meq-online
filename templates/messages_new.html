{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Envoyer un message</h1>
  <form method="post" action="{{ base_url }}" class="box">
    <div class="field">
      <label for="receiver">À</label>
      <select id="receiver" name="receiver">
        {% for (value, name) in receivers %}<option value="{{ value }}">{{ name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field" style="max-width: none">
      <label for="text">Votre message</label>
      <textarea id="text" name="text"></textarea>
    </div>
    <div class="actions"><button type="submit" class="btn btn-primary">Envoyer</button></div>
  </form>
</div>
{% endblock %}
