{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Envoyer un message</h3>
  <form method="post" action="{{ base_url }}">
    <div class="field">
      <label for="receiver">À</label>
      <select class="form-control" id="receiver" name="receiver">
        {% for (value, name) in receivers %}<option value="{{ value }}">{{ name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field mt-2">
      <label for="text">Votre message</label>
      <textarea class="form-control" id="text" name="text"></textarea>
    </div>
    <div class="actions mt-3"><button type="submit" class="btn btn-secondary">Envoyer</button></div>
  </form>
</div>
{% endblock %}
