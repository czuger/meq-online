<h4>{{ fighter.name }}</h4>
<div class="stats">
  <span class="stat"><span class="stat-label">Force utilisée</span><span class="stat-value">{{ fighter.used_strength }} / {{ fighter.strength }}</span></span>
  <span class="stat"><span class="stat-label">Dégâts subis</span><span class="stat-value">{{ fighter.damages_taken }}</span></span>
  <span class="stat"><span class="stat-label">Vie restante</span><span class="stat-value">{{ fighter.life }}</span></span>
</div>
