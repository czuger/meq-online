{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Déplacer</h1>
  <p class="lead">Choisissez la destination.</p>
  <form method="post" action="/sauron/{{ sauron_id }}/sauron_mobs/{{ mob_id }}" id="move-mob-form">
    <div class="button-grid">
      {% for location in locations %}
      <button type="submit" name="button" value="{{ location.code }}" class="btn">{{ location.name }}</button>
      {% endfor %}
    </div>
  </form>
  <div class="actions"><a class="btn btn-quiet" role="button" href="/sauron/{{ sauron_id }}/sauron_mobs">Retour</a></div>
</div>
{% endblock %}
