{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Déplacer le monstre</h3>
  <hr>
  <form method="post" action="/sauron/{{ sauron_id }}/sauron_mobs/{{ mob_id }}">
    <div class="row">
      {% for location in locations %}
      <div class="col-md-4 mt-2"><button type="submit" name="button" value="{{ location.code }}" class="btn btn-secondary btn-block">{{ location.name }}</button></div>
      {% endfor %}
    </div>
  </form>
  <div class="row"><div class="col-md-4 mt-2"><a class="btn btn-primary btn-block" role="button" href="/sauron/{{ sauron_id }}/sauron_actions/edit">Retour aux actions</a></div></div>
</div>
{% endblock %}
