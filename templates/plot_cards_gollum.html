{% extends "layout.html" %}
{% block content %}
<div class="page">
  <h1>Choisissez une carte Gollum</h1>
  <p class="lead">Vous devez choisir une carte Gollum.</p>
  <div class="cards">{% for card in cards %}<img src="{{ card.pic }}" class="medium-card selectable-card-selection-unique" data-card-id="{{ card.id }}" alt="">{% endfor %}</div>
  <form method="post" action="/sauron/{{ sauron_id }}/plot_cards/get_gollum_card">
    <input type="hidden" id="selected_card" name="selected_card">
    <div class="actions"><button type="submit" class="btn btn-primary" id="validate_unique" disabled title="Choisissez d'abord une carte">Garder la carte</button></div>
  </form>
</div>
{% endblock %}
