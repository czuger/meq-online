{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Choisissez une carte Gollum</h3>
  <div class="alert alert-secondary"><ul class="mt-3"><li>Vous devez choisir une carte Gollum.</li></ul></div>
  {% for card in cards %}<img src="{{ card.pic }}" class="medium-card selectable-card-selection-unique" data-card-id="{{ card.id }}" alt="">{% endfor %}
  <form method="post" action="/sauron/{{ sauron_id }}/plot_cards/get_gollum_card" class="ml-3">
    <div class="row">
      <div class="col-md-2">
        <input type="hidden" id="selected_card" name="selected_card">
        <button type="submit" class="btn btn-secondary btn-block" id="validate_unique" disabled>Garder la carte</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
