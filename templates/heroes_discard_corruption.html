{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h3>Défausser une carte de corruption</h3>
  <div class="alert alert-secondary"><ul class="mt-3"><li>Choisissez une carte de corruption à défausser.</li></ul></div>
  <div class="corruption_area">
    {% for card in corruptions %}
    <img src="{{ card.pic }}" class="selectable-card-selection-unique" data-card-id="{{ card.id }}" alt="">
    {% endfor %}
  </div>
  <form method="post" action="/heroes/{{ hero_id }}/discard_corruption_card" class="ml-3 mt-3">
    <input type="hidden" id="selected_card" name="selected_card">
    <button type="submit" class="btn btn-primary" id="validate_unique" disabled>Défausser la carte</button>
  </form>
</div>
{% endblock %}
